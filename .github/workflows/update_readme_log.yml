name: Append Push Info to README

on:
  push:
    branches:
      - '**'  # 모든 브랜치

permissions:
  contents: write

jobs:
  update-readme-log:
    if: "!contains(github.event.head_commit.message, '[bot]')"  # 반복 방지
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

      - name: Append commit info to README.md
        run: |
          echo -e "\n### 📝 Commit Log\n" >> README.md
          echo -e "**Author:** $(git log -1 --pretty=format:'%an')\n" >> README.md
          echo -e "**Message:** $(git log -1 --pretty=format:'%s')\n" >> README.md
          echo -e "**Commit:** $(git log -1 --pretty=format:'%H')\n" >> README.md
          echo -e "**Date:** $(date '+%Y-%m-%d %H:%M:%S')\n" >> README.md

      - name: Commit and push changes
        run: |
          git add README.md
          git commit -m "Update README with commit info [bot]" || echo "No changes"
          git push
