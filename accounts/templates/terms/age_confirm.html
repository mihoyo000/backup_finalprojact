{% load static %}

<div class="modal fade" id="terms-age-confirm" tabindex="-1" aria-labelledby="terms-age-confirm-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content terms-modal-content"> 

      <div class="terms-modal-header">
        <h5 class="modal-title" id="terms-age-confirm-label">만 14세 이상 여부 확인</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>

      <div class="terms-modal-body">
        <p>
          만 14세 미만 아동의 개인정보는 「개인정보 보호법」 및<br>
          「정보통신망 이용촉진 및 정보보호 등에 관한 법률」에 따라 보호됩니다.
        </p>

        <p>
          회사는 만 14세 미만 아동으로부터는 법정대리인의 동의 없이 개인정보를 수집하지 않으며,<br>
          만 14세 미만 사용자는 flo 서비스에 회원가입을 할 수 없습니다.
        </p>

        <p><strong>본인은 만 14세 이상이며, 이에 동의합니다.</strong></p>
      </div>

      <div class="terms-modal-footer">
        <button type="button" class="terms-confirm-btn" data-bs-dismiss="modal">확인</button>
      </div>

    </div>
  </div>
</div>

<link rel="stylesheet" href="{% static 'flo/css/trems.css' %}">
