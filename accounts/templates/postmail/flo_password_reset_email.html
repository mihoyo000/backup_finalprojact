<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[Flo] 비밀번호 재설정 안내</title>
  <style>
    body {
      background: #fff;
      font-family: 'Arial', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      color: #181818;
    }
    .mail-wrap {
      max-width: 470px;
      margin: 32px auto 0 auto;
      padding: 0 10px 32px 10px; 
      background: #fff;
    }
    .top-box {
      max-width: 500px;
      height: 40px;
      background: #fff;
    }
    .logo {
      display: block;
      width: 100px;
      margin: 16px 0 0 0;
    }
    .section {
      background: #fff;
      border-radius: 14px;
      margin: 28px 0 0 0;
      padding: 0;
      text-align: left;
    }
    .mail-title {
      font-size: 17px;
      font-weight: 600;
      margin: 18px 0 0 0;
      color: #111;
      letter-spacing: -0.5px;
    }
    .desc {
      font-size: 16px;
      margin: 18px 0 20px 0;
      color: #111;
      font-weight: 400;
      line-height: 1.6;
    }
    .desc strong {
      color: #111;
    }
    .reset-row {
      margin: 20px 0 26px 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reset-btn {
      display: inline-block;
      padding: 0 16px;
      height: 34px;
      line-height: 34px;
      background: #1a1a1a;
      color: #fff !important;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      vertical-align: middle;
      margin-left: 7px;
    }
    .info {
      font-size: 15px;
      color: #222;
      margin: 16px 0 0 0;
      line-height: 1.7;
    }
    .gray {
      color: #555;
      font-size: 14px;
      margin-top: 32px;
      padding-top: 14px;
      border-top: 1.3px solid #bbb;
      letter-spacing: -0.2px;
    }
    .login-btn {
      display: block;
      margin: 26px auto 0 auto;
      padding: 0 24px;
      width: 200px;
      height: 40px;
      background: #2a2a2a;
      color: #fff !important;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.5px;
    }
    @media (max-width: 540px) {
      .mail-wrap { max-width: 98vw; }
      .logo { width: 80px; }
    }
  </style>
</head>
<body>
  <div class="mail-wrap">
    <div class="top-box">
     <img src="https://cdn.jsdelivr.net/gh/siwoo-zen/img-host/fl_logo_lite.png" alt="Flo 로고" class="logo">
    </div>
    <div class="section">
      <br>
      <div class="mail-title">
        [Flo] 비밀번호를 재설정해 주세요 🔐
      </div>
      <div class="desc">
        안녕하세요!<br><br>
        회원님의 계정을 안전하게 보호하기 위해<br>
        비밀번호 재설정을 요청하셨습니다.<br><br>
        아래 버튼을 눌러 새 비밀번호를 설정해 주세요:
      </div>
      <div class="reset-row">
        <span>👉 [비밀번호 재설정하기]</span>
        <a href="{{ reset_url }}" class="reset-btn">비밀번호 재설정</a>
      </div>
      <div class="info">
        ⏰ 이 링크는 보안상 <strong>24시간</strong> 동안만 유효합니다.<br>
        시간이 지나면 다시 요청해 주세요.<br><br>
        만약 본인이 요청한 것이 아니라면,<br>
        이 메일은 무시하셔도 됩니다.<br><br>
        감사합니다.<br>
        Flo 팀 드림 🌱
      </div>
      <div class="gray">
        ※ 본 메일은 발신 전용입니다. 회신하지 말아 주세요.
      </div>
      <a href="{{ login_url }}" class="login-btn">로그인 하러가기</a>
    </div>
  </div>
</body>
</html>
