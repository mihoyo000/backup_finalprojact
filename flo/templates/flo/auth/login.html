{% load static %}

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content login-box">
      <div class="modal-header border-0 d-flex justify-content-between">
        <h2 class="modal-title" id="loginModalLabel">Login</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form method="post" action="{% url 'flo:login' %}" id="loginForm">
          {% csrf_token %}
          <div class="input-box">
            <input type="text" id="username" name="username" required>
            <label for="username">ID</label>
            <i class="bi bi-envelope icon"></i>
          </div>
          <div class="input-box">
            <input type="password" id="password" name="password" required>
            <label for="password">Password</label>
            <i class="bi bi-lock icon"></i>
          </div>
          <div class="remember-forgot">
            <label>
              <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="{% url 'accounts:find_password' %}">Forgot password?</a>
          </div>
          <div id="loginAlert">
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags == 'info' %}
                        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endif %}
                {% endfor %}
            {% endif %}
          </div>
          <button type="submit">Login</button>
        </form>
        {% comment %}
        <div class="google-login-form">
          <button class="gsi-material-button" id="googleLoginBtn" data-url="{% url 'social:begin' 'google-oauth2' %}">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
              <div class="gsi-material-button-icon">
                <!-- Google SVG icon code -->
              </div>
              <span class="gsi-material-button-contents">Sign in with Google</span>
            </div>
          </button>
        </div>
        {% endcomment %}
        <div class="register-link">
          <p>Don't have an account?<a href="{% url 'accounts:signup' %}">Sign up</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="{% static 'flo/css/login.css' %}">

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');
    
    // 로그아웃 메시지 자동 제거
    const logoutAlert = loginAlert.querySelector('.alert-info');
    if (logoutAlert) {
        setTimeout(() => {
            logoutAlert.remove();
        }, 30000);
    }
    
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        fetch(this.action, {
            method: 'POST',
            body: new FormData(this),
            headers: {
                'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrfToken
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 로그인 성공 시 얼럿 표시
                alert(data.message);
                // 1초 후 페이지 새로고침
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                // 로그인 실패 시 알림 메시지
                loginAlert.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                        ${data.message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            // 오류 발생 시 알림 메시지
            loginAlert.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                    로그인 처리 중 오류가 발생했습니다.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        });
    });
});
</script>
